apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer-portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "customer-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "customer-portal.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "customer-portal.serviceAccountName" . }}
      containers:
        - name: {{ include "customer-portal.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
